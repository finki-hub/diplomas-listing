name: Lint Shared

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tsc:
    uses: finki-hub/.github/.github/workflows/tsc.yaml@main
    with:
      script: check:shared
  eslint:
    uses: finki-hub/.github/.github/workflows/eslint.yaml@main
    with:
      script: lint:shared
