name = "finki-hub-masters-api"
main = "src/index.ts"
compatibility_date = "2025-02-06"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[build]
command = "node ../scripts/build-revision.mjs"

[vars]
# POSTHOG_KEY is supplied at deploy (e.g. `wrangler secret put POSTHOG_KEY`) to enable analytics; absent = off.
POSTHOG_HOST = "https://eu.i.posthog.com"

[placement]
mode = "smart"

[observability]
enabled = true

[observability.logs]
enabled = true
# Automatic request/span payloads include URLs; retain structured app logs.
invocation_logs = false

[observability.traces]
enabled = false

[[routes]]
pattern = "magisterski-api.finki-hub.com"
custom_domain = true
